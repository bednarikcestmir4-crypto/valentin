
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentýn ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6c9, #ff5c8a);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
}

.card {
    background: white;
    padding: 40px 25px;
    border-radius: 25px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 10px 35px #a0000040;
    position: relative;
    z-index: 2;
}

h1 {
    color: #ff3675;
    font-size: 30px;
}

p {
    color: #777;
    font-size: 18px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 35px;
    min-height: 65px;
}

button {
    border: none;
    padding: 15px 30px;
    border-radius: 15px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

#yes {
    background: #ff3675;
    color: white;
    transition: transform 0.2s;
}

#no {
    background: #777;
    color: white;
    transition: left 0.25s, top 0.25s, transform 0.25s;
}

#no.moving {
    position: fixed;
    z-index: 10;
}

#celebration {
    display: none;
    color: #ff3675;
}

.balloon {
    position: fixed;
    bottom: -120px;
    font-size: 45px;
    animation: fly 5s linear forwards;
    z-index: 5;
    pointer-events: none;
}

@keyframes fly {
    to {
        transform: translateY(-120vh) rotate(25deg);
    }
}

.confetti {
    position: fixed;
    top: -20px;
    font-size: 25px;
    animation: fall 4s linear forwards;
    pointer-events: none;
    z-index: 6;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<div class="card" id="main">

    <div id="question">
        <h1>Budeš moje Valentýnka? ❤️</h1>
        <p>Mám pro tebe jednu důležitou otázku...</p>

        <div class="buttons">
            <button id="yes" onclick="sayYes()">ANO ❤️</button>
            <button id="no" onclick="moveNo()">NE 💔</button>
        </div>
    </div>

    <div id="celebration">
        <h1>JUPÍÍÍ! ❤️🥰</h1>
        <h2>Věděl/a jsem, že řekneš ANO!</h2>
        <p>Udělal/a jsi mi obrovskou radost! 💕</p>
        <h1>🎈🎉💗🎊</h1>
    </div>

</div>

<script>
let noSize = 1;
let clicks = 0;

function moveNo() {
    const no = document.getElementById("no");

    no.classList.add("moving");

    clicks++;

    // Zmenšení tlačítka
    noSize = Math.max(0.15, noSize - 0.12);
    no.style.transform = "scale(" + noSize + ")";

    // Náhodná nová pozice
    const maxX = window.innerWidth - no.offsetWidth * noSize - 20;
    const maxY = window.innerHeight - no.offsetHeight * noSize - 20;

    const x = Math.random() * Math.max(0, maxX);
    const y = Math.random() * Math.max(0, maxY);

    no.style.left = x + "px";
    no.style.top = y + "px";

    // Text se může postupně měnit
    if (clicks === 3) {
        no.innerText = "Opravdu NE? 😭";
    }

    if (clicks === 6) {
        no.innerText = "NE?! 🥺";
    }

    if (clicks === 9) {
        no.innerText = "NE 💔";
    }
}

function sayYes() {
    document.getElementById("question").style.display = "none";
    document.getElementById("celebration").style.display = "block";

    document.getElementById("no").style.display = "none";

    // Balónky
    for (let i = 0; i < 20; i++) {
        setTimeout(() => {
            let balloon = document.createElement("div");
            balloon.className = "balloon";
            balloon.innerText = ["🎈", "❤️", "💗", "💕"][Math.floor(Math.random() * 4)];
            balloon.style.left = Math.random() * 100 + "vw";
            document.body.appendChild(balloon);

            setTimeout(() => balloon.remove(), 5000);
        }, i * 180);
    }

    // Konfety
    for (let i = 0; i < 60; i++) {
        let confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.innerText = ["🎊", "🎉", "💖", "✨"][Math.floor(Math.random() * 4)];
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDelay = Math.random() * 2 + "s";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 6000);
    }
}
</script>

</body>
</html>
